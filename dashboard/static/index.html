<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>audio-edge Dashboard</title>
<style>
/* ============================================================
   Reset & Base — Dark Theme
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #0f1117;
  --surface:    #1a1d27;
  --surface2:   #242736;
  --border:     #2e3145;
  --text:       #e1e4ed;
  --text-dim:   #8b8fa5;
  --green:      #34d399;
  --green-dim:  #065f46;
  --red:        #f87171;
  --red-dim:    #7f1d1d;
  --blue:       #60a5fa;
  --blue-dim:   #1e3a5f;
  --yellow:     #fbbf24;
  --yellow-dim: #78350f;
  --purple:     #a78bfa;
  --purple-dim: #4c1d95;
  --radius:     12px;
  --font:       "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:       "Cascadia Code", "Fira Code", "Consolas", monospace;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ============================================================
   Header
   ============================================================ */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-left { display: flex; align-items: center; gap: 12px; }
.header-left h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
.header-left .badge {
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 3px 8px;
  border-radius: 4px;
  background: var(--purple-dim);
  color: var(--purple);
}

.connection-dot {
  display: inline-block;
  width: 10px; height: 10px;
  border-radius: 50%;
  margin-right: 6px;
  background: var(--text-dim);
  transition: background 0.3s;
}
.connection-dot.online  { background: var(--green);  box-shadow: 0 0 8px var(--green); }
.connection-dot.offline { background: var(--red);    box-shadow: 0 0 8px var(--red); }

/* ============================================================
   Main Grid
   ============================================================ */
main {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
  padding: 20px 24px;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
}

/* ============================================================
   Status Cards
   ============================================================ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: border-color 0.3s, box-shadow 0.3s;
  min-height: 180px;
}

.card:hover { border-color: #3e4260; }

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.card-task {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 4px 10px;
  border-radius: 6px;
}
.card-task.vad { background: var(--red-dim);    color: var(--red); }
.card-task.kws { background: var(--blue-dim);   color: var(--blue); }
.card-task.sed { background: var(--yellow-dim); color: var(--yellow); }
.card-task.asc { background: var(--green-dim);  color: var(--green); }

.card-icon {
  font-size: 2rem;
  line-height: 1;
  opacity: 0.4;
  transition: opacity 0.3s;
}
.card.active .card-icon { opacity: 1; }

.card-label {
  font-size: 1.5rem;
  font-weight: 700;
  word-break: break-word;
  line-height: 1.2;
}

.card-conf {
  font-family: var(--mono);
  font-size: 0.85rem;
  color: var(--text-dim);
}

.card-conf strong { color: var(--text); font-size: 1.1rem; }

.card-time {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--text-dim);
  margin-top: auto;
}

/* ============================================================
   Event Timeline
   ============================================================ */
.timeline-section {
  padding: 0 24px 24px;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
}

.timeline-section h2 {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  margin-bottom: 12px;
}

.timeline {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  max-height: 320px;
  overflow-y: auto;
  font-family: var(--mono);
  font-size: 0.8rem;
}

.timeline::-webkit-scrollbar { width: 6px; }
.timeline::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.timeline-row {
  display: grid;
  grid-template-columns: 80px 40px 1fr 70px;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
}
.timeline-row:hover { background: var(--surface2); }
.timeline-row:last-child { border-bottom: none; }

.timeline-time { color: var(--text-dim); }
.timeline-task {
  font-weight: 700;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  text-align: center;
  padding: 2px 6px;
  border-radius: 4px;
}
.timeline-task.vad { background: var(--red-dim);    color: var(--red); }
.timeline-task.kws { background: var(--blue-dim);   color: var(--blue); }
.timeline-task.sed { background: var(--yellow-dim); color: var(--yellow); }
.timeline-task.asc { background: var(--green-dim);  color: var(--green); }

.timeline-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.timeline-conf { text-align: right; color: var(--text-dim); }

.timeline-empty {
  text-align: center;
  padding: 40px 16px;
  color: var(--text-dim);
  font-family: var(--font);
  font-size: 0.9rem;
}
.review-section { max-width: 1400px; width: 100%; margin: 0 auto; padding: 0 24px 24px; }
.review-section h2 { font-size: 1rem; margin-bottom: 12px; }
.review-row { display: grid; grid-template-columns: 165px minmax(120px, 1fr) 210px 150px;
  align-items: center; gap: 12px; border-bottom: 1px solid var(--border); padding: 10px 0; }
.review-row audio { max-width: 100%; width: 210px; height: 36px; }
.review-row video { max-width: 100%; width: 210px; margin-top: 6px; }
.review-actions { display: flex; gap: 6px; }
.review-actions button { cursor: pointer; border: 1px solid var(--border); border-radius: 4px;
  background: var(--surface2); color: var(--text); padding: 6px 9px; }
.review-actions button:hover { border-color: var(--green); }
.review-status { color: var(--text-dim); font-size: 0.8rem; }

/* ============================================================
   Footer bar
   ============================================================ */
.footer-bar {
  padding: 10px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  font-size: 0.7rem;
  color: var(--text-dim);
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width: 600px) {
  main { grid-template-columns: 1fr; padding: 12px; }
  header { padding: 12px; }
  .card { min-height: auto; }
  .timeline-row { grid-template-columns: 70px 32px 1fr 60px; font-size: 0.72rem; }
  .review-row { grid-template-columns: 1fr 1fr; }
  .review-section { padding: 0 12px 24px; }
}
</style>
</head>
<body>

<!-- ============================================================
     Header
     ============================================================ -->
<header>
  <div class="header-left">
    <h1>audio-edge</h1>
    <span class="badge">Live</span>
  </div>
  <div id="conn-status">
    <span class="connection-dot" id="conn-dot"></span>
    <span id="conn-text">Connecting...</span>
  </div>
</header>

<!-- ============================================================
     Status Cards
     ============================================================ -->
<main>
  <!-- VAD -->
  <div class="card" id="card-vad">
    <div class="card-header">
      <span class="card-task vad">VAD</span>
      <span class="card-icon">🎤</span>
    </div>
    <div class="card-label" id="vad-label">--</div>
    <div class="card-conf">置信度 <strong id="vad-conf">--</strong></div>
    <div class="card-time" id="vad-time"></div>
  </div>

  <!-- KWS -->
  <div class="card" id="card-kws">
    <div class="card-header">
      <span class="card-task kws">KWS</span>
      <span class="card-icon">🔑</span>
    </div>
    <div class="card-label" id="kws-label">--</div>
    <div class="card-conf">置信度 <strong id="kws-conf">--</strong></div>
    <div class="card-time" id="kws-time"></div>
  </div>

  <!-- SED -->
  <div class="card" id="card-sed">
    <div class="card-header">
      <span class="card-task sed">SED</span>
      <span class="card-icon">🔔</span>
    </div>
    <div class="card-label" id="sed-label">--</div>
    <div class="card-conf">置信度 <strong id="sed-conf">--</strong></div>
    <div class="card-time" id="sed-time"></div>
  </div>

  <!-- ASC -->
  <div class="card" id="card-asc">
    <div class="card-header">
      <span class="card-task asc">ASC</span>
      <span class="card-icon">🏠</span>
    </div>
    <div class="card-label" id="asc-label">--</div>
    <div class="card-conf">置信度 <strong id="asc-conf">--</strong></div>
    <div class="card-time" id="asc-time"></div>
  </div>
</main>

<!-- ============================================================
     Event Timeline
     ============================================================ -->
<div class="timeline-section">
  <h2>事件时间线</h2>
  <div class="timeline" id="timeline">
    <div class="timeline-empty">等待事件...</div>
  </div>
</div>

<section class="review-section" id="review-section" hidden>
  <h2>音事件候选复核</h2>
  <p class="review-status">邻近视频事件仅表示时间接近；候选附带的视频片段则来自同一个媒体文件，均需人工复核。</p>
  <div id="review-list" aria-live="polite"></div>
</section>

<section class="review-section" id="video-section" hidden>
  <h2>视频事件</h2>
  <div id="video-list" aria-live="polite"></div>
</section>

<!-- ============================================================
     Footer
     ============================================================ -->
<div class="footer-bar">
  <span id="event-count">事件: 0</span>
  <span>WebSocket 仪表板 — 可复用于 YOLO 等项目</span>
</div>

<!-- ============================================================
     JavaScript — WebSocket Client
     ============================================================ -->
<script>
(function () {
  'use strict';

  // --- DOM refs ------------------------------------------------------
  const $connDot   = document.getElementById('conn-dot');
  const $connText  = document.getElementById('conn-text');
  const $timeline  = document.getElementById('timeline');
  const $eventCount = document.getElementById('event-count');

  // Card elements keyed by task name
  const cards = {
    vad: {
      el:     document.getElementById('card-vad'),
      label:  document.getElementById('vad-label'),
      conf:   document.getElementById('vad-conf'),
      time:   document.getElementById('vad-time'),
    },
    kws: {
      el:     document.getElementById('card-kws'),
      label:  document.getElementById('kws-label'),
      conf:   document.getElementById('kws-conf'),
      time:   document.getElementById('kws-time'),
    },
    sed: {
      el:     document.getElementById('card-sed'),
      label:  document.getElementById('sed-label'),
      conf:   document.getElementById('sed-conf'),
      time:   document.getElementById('sed-time'),
    },
    asc: {
      el:     document.getElementById('card-asc'),
      label:  document.getElementById('asc-label'),
      conf:   document.getElementById('asc-conf'),
      time:   document.getElementById('asc-time'),
    },
  };

  let totalEvents = 0;
  const $reviewSection = document.getElementById('review-section');
  const $reviewList = document.getElementById('review-list');
  const $videoSection = document.getElementById('video-section');
  const $videoList = document.getElementById('video-list');

  async function loadCandidates() {
    try {
      const response = await fetch('/api/associations');
      if (!response.ok) return;
      const associations = await response.json();
      $reviewSection.hidden = false;
      $reviewList.replaceChildren();
      if (!associations.length) {
        const empty = document.createElement('p');
        empty.className = 'review-status';
        empty.textContent = '暂无候选事件';
        $reviewList.appendChild(empty);
      }
      for (const association of associations) {
        const candidate = association.audio;
        const row = document.createElement('div');
        row.className = 'review-row';
        const time = document.createElement('span');
        time.textContent = new Date(candidate.timestamp * 1000).toLocaleString('zh-CN');
        const label = document.createElement('span');
        const video = association.nearby_video;
        label.textContent = candidate.label + ' · ' + fmtConf(candidate.confidence) +
          (video.length ? ' · 邻近视频: ' + video.map(item => item.type).join(', ') : ' · 无邻近视频事件');
        const media = document.createElement('div');
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.preload = 'none';
        audio.src = '/api/candidates/' + encodeURIComponent(candidate.id) + '/audio';
        media.appendChild(audio);
        if (association.media_evidence) {
          const videoClip = document.createElement('video');
          videoClip.controls = true;
          videoClip.preload = 'none';
          videoClip.title = '同一媒体文件的视频证据';
          videoClip.src = '/api/candidates/' + encodeURIComponent(candidate.id) + '/video';
          media.appendChild(videoClip);
        }
        const actions = document.createElement('div');
        actions.className = 'review-actions';
        if (candidate.status === 'pending') {
          for (const [text, status] of [['确认', 'confirmed'], ['驳回', 'rejected']]) {
            const button = document.createElement('button');
            button.type = 'button';
            button.textContent = text;
            button.onclick = async () => {
              const res = await fetch('/api/candidates/' + encodeURIComponent(candidate.id), {
                method: 'PATCH', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({status})
              });
              if (res.ok) await loadCandidates();
            };
            actions.appendChild(button);
          }
        } else {
          actions.className = 'review-status';
          actions.textContent = candidate.status === 'confirmed' ? '已确认' : '已驳回';
        }
        row.append(time, label, media, actions);
        $reviewList.appendChild(row);
      }
    } catch (e) { /* Server may be restarting. */ }
  }

  async function loadVideoEvents() {
    try {
      const response = await fetch('/api/video-events');
      if (!response.ok) return;
      const events = await response.json();
      $videoSection.hidden = false;
      $videoList.replaceChildren();
      if (!events.length) {
        const empty = document.createElement('p');
        empty.className = 'review-status';
        empty.textContent = '暂无视频事件';
        $videoList.appendChild(empty);
      }
      for (const event of events) {
        const row = document.createElement('div');
        row.className = 'review-row';
        const time = document.createElement('span');
        time.textContent = new Date(event.timestamp_ms).toLocaleString('zh-CN');
        const source = document.createElement('span');
        source.textContent = event.type + ' · ' + event.source_id;
        const objects = document.createElement('span');
        objects.textContent = event.payload.objects.map(item => item.name).join(', ') || '无目标';
        row.append(time, source, objects);
        $videoList.appendChild(row);
      }
    } catch (e) { /* Server may be restarting. */ }
  }

  // --- Helpers -------------------------------------------------------
  function fmtTime(ts) {
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString('zh-CN', { hour12: false });
  }

  function fmtConf(v) {
    return (v * 100).toFixed(1) + '%';
  }

  // --- Set connection status -----------------------------------------
  function setConnected(ok) {
    $connDot.className = 'connection-dot ' + (ok ? 'online' : 'offline');
    $connText.textContent = ok ? '已连接' : '已断开';
  }

  // --- Update a card -------------------------------------------------
  function updateCard(task, evt) {
    const c = cards[task];
    if (!c) return;
    c.el.classList.add('active');
    c.label.textContent = evt.label || '--';
    c.conf.innerHTML = '<strong>' + fmtConf(evt.confidence) + '</strong>';
    c.time.textContent = fmtTime(evt.timestamp);
  }

  // --- Append to timeline --------------------------------------------
  function appendTimeline(evt) {
    // Remove "waiting" placeholder on first event
    const empty = $timeline.querySelector('.timeline-empty');
    if (empty) empty.remove();

    const row = document.createElement('div');
    row.className = 'timeline-row';

    const timeEl = document.createElement('span');
    timeEl.className = 'timeline-time';
    timeEl.textContent = fmtTime(evt.timestamp);

    const taskEl = document.createElement('span');
    taskEl.className = 'timeline-task ' + (evt.task || '');
    taskEl.textContent = (evt.task || '').toUpperCase();

    const labelEl = document.createElement('span');
    labelEl.className = 'timeline-label';
    labelEl.textContent = evt.label || '--';

    const confEl = document.createElement('span');
    confEl.className = 'timeline-conf';
    confEl.textContent = fmtConf(evt.confidence);

    row.appendChild(timeEl);
    row.appendChild(taskEl);
    row.appendChild(labelEl);
    row.appendChild(confEl);

    $timeline.appendChild(row);

    // Auto-scroll to bottom
    $timeline.scrollTop = $timeline.scrollHeight;

    // Limit to ~200 visible rows
    while ($timeline.children.length > 200) {
      $timeline.firstChild.remove();
    }
  }

  // --- WebSocket lifecycle -------------------------------------------
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = proto + '://' + location.host + '/ws';
    const ws = new WebSocket(url);

    ws.onopen = function () {
      setConnected(true);
    };

    ws.onclose = function () {
      setConnected(false);
      // Reconnect after 2s
      setTimeout(connect, 2000);
    };

    ws.onerror = function () {
      // onclose will fire next — just let it handle reconnection
    };

    ws.onmessage = function (msg) {
      try {
        const data = JSON.parse(msg.data);
        // Skip heartbeats
        if (data.type === 'heartbeat') return;

        const task = data.task;
        if (cards[task]) {
          updateCard(task, data);
        }
        appendTimeline(data);

        totalEvents++;
        $eventCount.textContent = '事件: ' + totalEvents;

      } catch (e) {
        // Ignore malformed messages
      }
    };
  }

  // --- Kick off ------------------------------------------------------
  connect();
  loadCandidates();
  loadVideoEvents();
  setInterval(() => { loadCandidates(); loadVideoEvents(); }, 5000);
})();
</script>
</body>
</html>
